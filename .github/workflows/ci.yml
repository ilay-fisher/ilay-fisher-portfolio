name: CI

# Pull requests and main only (a branch push with an open PR would otherwise run everything twice).
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR or branch supersedes the running job.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # e2e runs against `vite preview` of the build above, in two steps: ordinary specs in parallel, then the
      # GL-heavy and smooth-scroll specs alone on one worker so they never starve (or get starved by) anything else.
      # See playwright.config.ts. One retry is allowed and always reported: see the summary step.
      - name: e2e (default project, parallel)
        run: npx playwright test --project=default
        env:
          PORT: 5173
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-default.json
      - name: e2e (gl-heavy project, one worker)
        if: ${{ !cancelled() }}
        run: npx playwright test --project=gl-heavy --workers=1
        env:
          PORT: 5173
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-gl-heavy.json
      - name: e2e summary (every test that needed a retry is listed)
        if: ${{ !cancelled() }}
        run: node scripts/e2e-summary.mjs e2e-default.json e2e-gl-heavy.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            e2e-*.json
            test-results/
          retention-days: 7
